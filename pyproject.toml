[project]
name = "cropstudio"
version = "0.1.0"
description = "Editor de recortes no destructivos para Windows"
requires-python = ">=3.13"
dependencies = ["PySide6>=6.10,<7", "Pillow>=12,<13"]

[dependency-groups]
dev = ["pytest>=9,<10", "pytest-qt>=4.5,<5", "pyinstaller>=6.16,<7"]

[project.scripts]
cropstudio = "main:main"

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["models*", "storage*", "services*", "ui*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
